<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>NOAA Stations</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>
      <button id="load">Pobierz stacje</button>
      <button id="loadLocations">Pobierz lokalizacje</button>
      <button id="loadData">Pobierz dane</button>
    </div>

    <div id="dataParams">
      <label>datasetid <input id="datasetid" value="GHCND"></label>
      <label>locationid <input id="locationid" value="ZIP:28801"></label>
      <label>startdate <input id="startdate" type="date" value="2010-05-01"></label>
      <label>enddate <input id="enddate" type="date" value="2010-05-01"></label>
    </div>

    <p id="error" class="hidden"></p>

    <div id="answer">
      <table id="stationsTable" class="hidden">
        <thead>
          <tr>
            <th>Station ID</th>
            <th>Name</th>
            <th>Latitude</th>
            <th>Longitude</th>
          </tr>
        </thead>
        <tbody id="results">
        </tbody>
      </table>

      <table id="locationsTable" class="hidden">
        <thead>
          <tr>
            <th>Location ID</th>
            <th>Name</th>
            <th>Min Date</th>
            <th>Max Date</th>
            <th>Data Coverage</th>
          </tr>
        </thead>
        <tbody id="locations">
        </tbody>
      </table>

      <table id="dataTable" class="hidden">
        <thead>
          <tr>
            <th>Date</th>
            <th>Datatype</th>
            <th>Station</th>
            <th>Value</th>
            <th>Attributes</th>
          </tr>
        </thead>
        <tbody id="dataResults">
        </tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
