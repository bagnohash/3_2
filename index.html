<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>NOAA Stations</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>
      <button id="load">Pobierz stacje</button>
      <button id="loadLocations">Pobierz lokalizacje</button>
    </div>

    <div id="answer">
      <table id="stationsTable" class="hidden">
        <thead>
          <tr>
            <th>Station ID</th>
            <th>Name</th>
            <th>Latitude</th>
            <th>Longitude</th>
          </tr>
        </thead>
        <tbody id="results">
        </tbody>
      </table>

      <table id="locationsTable" class="hidden">
        <thead>
          <tr>
            <th>Location ID</th>
            <th>Name</th>
            <th>Min Date</th>
            <th>Max Date</th>
            <th>Data Coverage</th>
          </tr>
        </thead>
        <tbody id="locations">
        </tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
